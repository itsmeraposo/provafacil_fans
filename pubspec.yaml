name: provafacil_fans
description: >
  ProvaFácil FANS — app Flutter navegável com as telas, menus e fluxos de
  navegação dos perfis Professor, Direção e Repografia, integrado à API
  Node/Express + Firestore do ProvaFácil.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  web: ^1.1.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-fans.png
