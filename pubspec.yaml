name: provafacil_fans
description: >
  ProvaFácil FANS — app Flutter navegável com as telas, menus e fluxos de
  navegação dos perfis Professor, Direção e Repografia, integrado à API
  Node/Express + Firestore do ProvaFácil.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  web: ^1.1.1
  shared_preferences: ^2.3.0
  dio: ^5.8.0
  file_picker: ^10.0.0
  flutter_secure_storage: ^9.2.0
  flutter_local_notifications: ^19.0.0

# O flutter_local_notifications (plugin do Windows) exige xml 6, o que fez o
# pub rebaixar o archive para 4.0.9, versão que não funciona com o pacote
# image (erro: "decodeLazy isn't defined for ZLibDecoder"). Fixa o archive na
# versão que já funcionava.
dependency_overrides:
  archive: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-fans.png
